name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Apple Silicon Mac (M1/M2/M3/M4)
          - platform: macos-latest
            os-name: macos-arm64
            args: "--target aarch64-apple-darwin"

          # 2. Intel Mac
          - platform: macos-latest
            os-name: macos-intel
            args: "--target x86_64-apple-darwin"

          # 3. Linux (Ubuntu/Debian-based)
          - platform: ubuntu-latest
            os-name: linux-amd64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0.5.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Version __VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Cleanly rename output files based on the matrix os-name and original extension/bundle type
          releaseAssetNamePattern: "meshlog_[version]_[os-name].[bundle]"
